[package]
name = "dbus-bench"
version = "0.1.0"
edition = "2021"
default-run = "dbus-bench"

[dependencies]
futures-util = "0.3.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.14"
zbus = { version = "6.0.0", default-features = false, features = [
    "default-rt",
    "proxy",
    "serde_bytes",
    "service",
] }
zruntime = { version = "0.2.1", default-features = false, features = ["mpmc"] }
