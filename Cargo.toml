[package]
name = "dbus-bench"
version = "0.1.0"
edition = "2021"
default-run = "dbus-bench"

[dependencies]
futures-util = "0.3.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.14"
tokio = { version = "1.54.0", default-features = false, features = [
    "rt",
    "macros",
] }
zbus = { version = "6.0.0", default-features = false, features = [
    "proxy",
    "serde_bytes",
    "service",
    "tokio",
] }
